<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inspire Engineering - Report Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Hind Siliguri & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- html2pdf.js for Direct A4 PDF Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --wheel-item-height: 60px;
            --wheel-visible-rows: 3;
        }

        body {
            font-family: 'Inter', 'Hind Siliguri', sans-serif;
            background: radial-gradient(circle at 50% 0%, #eef2ff 0%, #e0e7ff 45%, #dbeafe 100%);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Animated Background Blobs */
        .bg-blob {
            position: fixed;
            border-radius: 9999px;
            filter: blur(70px);
            z-index: 0;
            opacity: 0.55;
            pointer-events: none;
            animation: floatBlob 12s infinite alternate ease-in-out;
        }
        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(25px, -25px) scale(1.08); }
        }

        /* Monospace tabular clock */
        .digital-clock {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.03em;
        }

        /* iPhone-Style 3-Row Wheel Picker */
        .wheel-wrapper {
            position: relative;
            height: calc(var(--wheel-item-height) * var(--wheel-visible-rows)); /* 144px = strictly 3 items */
            border-radius: 24px;
            background: linear-gradient(180deg, #f8fafc 0%, #ffffff 50%, #f8fafc 100%);
            box-shadow: inset 0 2px 8px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
            border: 1px solid rgba(226, 232, 240, 0.9);
            overflow: hidden;
            user-select: none;
        }

        /* Center selection bar like iOS alarm wheel */
        .wheel-highlight {
            position: absolute;
            top: var(--wheel-item-height); /* Middle row */
            left: 6px;
            right: 6px;
            height: var(--wheel-item-height);
            background: rgba(99, 102, 241, 0.08);
            border: 1.5px solid rgba(99, 102, 241, 0.22);
            border-radius: 9999px;
            pointer-events: none;
            z-index: 2;
        }

        /* Top and bottom soft fade masks */
        .wheel-mask-top,
        .wheel-mask-bottom {
            position: absolute;
            left: 0;
            right: 0;
            height: var(--wheel-item-height);
            pointer-events: none;
            z-index: 3;
        }
        .wheel-mask-top {
            top: 0;
            background: linear-gradient(to bottom, rgba(248, 250, 252, 0.85) 0%, rgba(248, 250, 252, 0) 100%);
        }
        .wheel-mask-bottom {
            bottom: 0;
            background: linear-gradient(to top, rgba(248, 250, 252, 0.85) 0%, rgba(248, 250, 252, 0) 100%);
        }

        /* Scrollable drum list */
        .wheel-scroller {
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding-top: var(--wheel-item-height);
            padding-bottom: var(--wheel-item-height);
            position: relative;
            z-index: 4;
            scroll-behavior: smooth;
        }
        .wheel-scroller::-webkit-scrollbar {
            display: none;
        }

        .wheel-item {
            height: var(--wheel-item-height);
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
                        color 0.2s ease,
                        opacity 0.2s ease,
                        font-size 0.2s ease;
            /* Default state: before/after (light gray & smaller) */
            font-size: 0.85rem;
            font-weight: 500;
            color: #94a3b8;
            opacity: 0.6;
            transform: scale(0.84);
            white-space: nowrap;
            padding: 0 8px;
        }

        /* Active Center Item: Normal size, bold, dark */
        .wheel-item.active {
            font-size: 1.08rem;
            font-weight: 700;
            color: #1e293b;
            opacity: 1;
            transform: scale(1.05);
        }

        /* Modal Transitions */
        .modal-backdrop {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .modal-backdrop.open {
            opacity: 1;
            visibility: visible;
        }
        .modal-card {
            transform: translateY(24px) scale(0.96);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }
        .modal-backdrop.open .modal-card {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        /* A4 Report Paper Styling (Strict 210mm x 297mm = 794px x 1123px at 96 DPI) */
        .a4-scale-wrapper {
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            flex-shrink: 0;
            border-radius: 6px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.12);
            background: #ffffff;
        }

        .a4-sheet {
            width: 794px !important;
            min-width: 794px !important;
            max-width: 794px !important;
            min-height: 1123px;
            flex-shrink: 0 !important;
            background: #ffffff;
            color: #0f172a;
            padding: 48px 48px 80px 48px;
            box-sizing: border-box;
            position: relative;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            transform-origin: top left;
        }

        /* Exact Report Table & Watermark Styles matching original app */
        .report-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.08;
            width: 56%;
            max-height: 56%;
            object-fit: contain;
            z-index: 0;
            pointer-events: none;
        }

        .report-content-layer {
            position: relative;
            z-index: 10;
            width: 100%;
        }

        .report-header-name {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            color: #0f172a;
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }

        .report-heading {
            font-size: 17px;
            font-weight: 700;
            text-align: center;
            color: #334155;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }

        .report-section-title {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            margin: 12px 0 6px 0;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .report-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            word-break: break-word;
            background-color: transparent;
            margin-bottom: 14px;
            font-size: 13px;
        }

        .report-table th,
        .report-table td {
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            vertical-align: top;
        }

        .report-table thead th {
            background-color: rgba(241, 245, 249, 0.85);
            font-weight: 700;
            color: #1e293b;
            text-align: left;
        }

        .report-summary-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 16px;
        }

        .report-summary-table {
            width: 280px !important;
            border-collapse: collapse;
            border: 1px solid #cbd5e1 !important;
            font-size: 13px;
        }

        .report-summary-table td {
            border: 1px solid #cbd5e1 !important;
            padding: 7px 10px !important;
        }

        .report-side-by-side {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            align-items: start;
            width: 100%;
        }

        .report-side-by-side > div {
            min-width: 0;
            width: 100%;
        }

        .report-footer-signatures {
            position: relative;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            padding-top: 40px;
            margin-top: 32px;
            color: #0f172a;
            font-size: 13px;
        }

        .report-sig-box {
            border-top: 1.5px solid #0f172a;
            width: 170px;
            text-align: center;
            padding-top: 6px;
        }
    </style>
</head>
<body class="text-slate-800 flex flex-col items-center justify-center min-h-screen p-4 sm:p-6 relative select-none">

    <!-- Decorative Ambient Background Blobs -->
    <div class="bg-blob w-72 h-72 bg-indigo-300 top-[-40px] left-[-40px]"></div>
    <div class="bg-blob w-80 h-80 bg-purple-300 bottom-[-50px] right-[-40px]" style="animation-delay: -5s;"></div>

    <!-- Main Centered Home Card -->
    <main class="relative z-10 w-full max-w-md bg-white/85 backdrop-blur-xl rounded-[2.25rem] shadow-[0_24px_60px_rgba(15,23,42,0.1)] border border-white p-7 sm:p-10 flex flex-col items-center text-center transition-all duration-500">

        <!-- Data Source Status Pill -->
        <div id="data-status-pill" class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-600 border border-indigo-100 mb-6 shadow-sm">
            <span id="status-dot" class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
            <span id="status-text">Checking data.json...</span>
        </div>

        <!-- Organization Logo (Shown if present in backup JSON) -->
        <div id="home-logo-wrapper" class="mb-4 hidden">
            <img id="home-logo-img" src="" alt="Inspire Engineering Logo" class="w-20 h-20 object-contain rounded-2xl p-2 bg-white shadow-md border border-slate-100 mx-auto">
        </div>

        <!-- 1. Organization Name -->
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 via-blue-600 to-purple-600 drop-shadow-sm mb-6">
            Inspire Engineering
        </h1>

        <!-- 2. Live Digital Clock with Seconds -->
        <div class="w-full bg-gradient-to-b from-slate-900 to-slate-800 text-white rounded-3xl py-6 px-4 shadow-xl border border-slate-700/60 mb-4 relative overflow-hidden">
            <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(99,102,241,0.22),transparent_60%)] pointer-events-none"></div>
            <div class="text-[11px] uppercase tracking-[0.2em] text-indigo-300 font-semibold mb-1.5">Current Time</div>
            <div class="flex items-baseline justify-center gap-1.5 digital-clock">
                <span id="clock-hm" class="text-4xl sm:text-5xl font-bold tracking-tight text-white">00:00</span>
                <span id="clock-sec" class="text-2xl sm:text-3xl font-bold text-indigo-400">:00</span>
                <span id="clock-ampm" class="text-sm sm:text-base font-bold text-slate-300 ml-1 px-2 py-0.5 rounded-md bg-slate-700/70">AM</span>
            </div>
        </div>

        <!-- 3. Current Date Display -->
        <div class="inline-flex items-center gap-2.5 px-5 py-2.5 rounded-2xl bg-slate-100/90 text-slate-700 font-semibold text-sm sm:text-base mb-8 border border-slate-200/70 shadow-inner">
            <i class="far fa-calendar-check text-indigo-600"></i>
            <span id="current-date-display">Loading date...</span>
        </div>

        <!-- 4. Primary Action Button: Report -->
        <button id="open-report-modal-btn" class="w-full py-4 px-8 rounded-full bg-gradient-to-r from-indigo-600 via-blue-600 to-purple-600 text-white font-bold text-lg shadow-[0_12px_28px_rgba(79,70,229,0.35)] hover:shadow-[0_16px_34px_rgba(79,70,229,0.48)] active:scale-[0.98] hover:scale-[1.02] transition-all duration-300 flex items-center justify-center gap-3 group">
            <i class="fas fa-file-invoice text-xl transition-transform duration-300 group-hover:rotate-6"></i>
            <span>Report</span>
        </button>

        <!-- Manual Backup JSON Loader & Refresh Controls -->
        <div class="w-full mt-6 pt-5 border-t border-slate-200/70 flex items-center justify-between gap-2 text-xs text-slate-500">
            <button id="manual-json-btn" onclick="document.getElementById('manual-json-input').click()" class="flex-1 py-2.5 px-3 rounded-xl bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 font-semibold transition-colors flex items-center justify-center gap-2 border border-slate-200/80">
                <i class="fas fa-folder-open text-indigo-500"></i>
                <span>Load JSON Backup</span>
            </button>
            <button id="reload-remote-json-btn" title="Reload data.json" class="py-2.5 px-3.5 rounded-xl bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 font-semibold transition-colors border border-slate-200/80 flex items-center justify-center gap-1.5">
                <i class="fas fa-sync-alt" id="sync-icon"></i>
                <span>Sync</span>
            </button>
            <input type="file" id="manual-json-input" accept=".json,application/json" class="hidden">
        </div>

        <!-- Summary Record Counter -->
        <p id="record-stats-text" class="mt-3 text-[11px] text-slate-400 font-medium">
            0 Sales • 0 Expenses loaded
        </p>
    </main>

    <!-- ==========================================
         MODAL 1: REPORT TYPE & iPHONE WHEEL PICKER
         ========================================== -->
    <div id="picker-modal" class="modal-backdrop fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="modal-card bg-white w-full max-w-md rounded-[2.25rem] shadow-2xl border border-slate-100 p-6 sm:p-7 relative overflow-hidden">

            <!-- Modal Header -->
            <div class="flex items-center justify-between mb-5">
                <div>
                    <h2 class="text-xl font-extrabold text-slate-800">Select Report</h2>
                    <p class="text-xs text-slate-500 font-medium">রিপোর্টের ধরন এবং তারিখ নির্বাচন করুন</p>
                </div>
                <button onclick="closePickerModal()" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Report Mode Switcher: মাসিক (Monthly) / দৈনিক (Daily) -->
            <div class="grid grid-cols-2 gap-2 p-1.5 bg-slate-100 rounded-full mb-6 border border-slate-200/70">
                <button id="tab-daily" onclick="switchReportMode('daily')" class="py-2.5 px-4 rounded-full font-bold text-sm transition-all duration-300 bg-indigo-600 text-white shadow-md flex items-center justify-center gap-2">
                    <i class="fas fa-calendar-day"></i>
                    <span>দৈনিক (Daily)</span>
                </button>
                <button id="tab-monthly" onclick="switchReportMode('monthly')" class="py-2.5 px-4 rounded-full font-bold text-sm transition-all duration-300 text-slate-600 hover:text-slate-900 flex items-center justify-center gap-2">
                    <i class="fas fa-calendar-alt"></i>
                    <span>মাসিক (Monthly)</span>
                </button>
            </div>

            <!-- Column Labels -->
            <div id="wheel-headers" class="grid grid-cols-3 gap-2.5 mb-2 text-center">
                <div class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50/80 py-1 rounded-full">সাল (Year)</div>
                <div class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50/80 py-1 rounded-full">মাস (Month)</div>
                <div id="day-header-label" class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50/80 py-1 rounded-full">দিন (Day)</div>
            </div>

            <!-- iPhone Alarm Style Round Wheel Selectors (Strictly 3 Visible Items per Wheel) -->
            <div id="wheels-grid" class="grid grid-cols-3 gap-2.5 items-center mb-6">
                <!-- Wheel 1: Year -->
                <div class="wheel-wrapper">
                    <div class="wheel-mask-top"></div>
                    <div class="wheel-highlight"></div>
                    <div id="wheel-year" class="wheel-scroller"></div>
                    <div class="wheel-mask-bottom"></div>
                </div>

                <!-- Wheel 2: Month -->
                <div class="wheel-wrapper">
                    <div class="wheel-mask-top"></div>
                    <div class="wheel-highlight"></div>
                    <div id="wheel-month" class="wheel-scroller"></div>
                    <div class="wheel-mask-bottom"></div>
                </div>

                <!-- Wheel 3: Day (Hidden in Monthly Mode) -->
                <div id="wheel-day-container" class="wheel-wrapper">
                    <div class="wheel-mask-top"></div>
                    <div class="wheel-highlight"></div>
                    <div id="wheel-day" class="wheel-scroller"></div>
                    <div class="wheel-mask-bottom"></div>
                </div>
            </div>

            <!-- Live Selection Pill -->
            <div class="flex items-center justify-between px-4 py-2.5 rounded-2xl bg-slate-50 border border-slate-200/80 mb-5 text-xs">
                <span class="text-slate-500 font-medium">Selected:</span>
                <span id="selected-date-badge" class="font-bold text-indigo-700">2026 - November - 15</span>
            </div>

            <!-- View Report Preview Button -->
            <button id="view-report-btn" onclick="openReportPreview()" class="w-full py-4 rounded-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold text-base shadow-lg hover:shadow-xl active:scale-[0.98] transition-all flex items-center justify-center gap-2.5">
                <i class="fas fa-eye"></i>
                <span>View Report (প্রিভিউ দেখুন)</span>
            </button>
        </div>
    </div>

    <!-- ==========================================
         MODAL 2: A4 REPORT PREVIEW & SAVE PDF
         ========================================== -->
    <div id="preview-modal" class="modal-backdrop fixed inset-0 z-50 bg-slate-900/85 backdrop-blur-md flex flex-col">
        <!-- Sticky Top Action Bar (Strictly NO Print Option, Only View, Zoom & Save PDF) -->
        <header class="w-full bg-slate-900/95 border-b border-slate-800 px-3 sm:px-6 py-3 flex items-center justify-between gap-2 shrink-0">
            <button onclick="closeReportPreview()" class="py-2 px-3.5 sm:px-4 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-semibold flex items-center gap-2 transition-colors">
                <i class="fas fa-arrow-left"></i>
                <span>Back</span>
            </button>

            <div class="text-center hidden md:block">
                <span id="preview-toolbar-title" class="text-sm font-bold text-white">A4 Report Preview</span>
                <span class="block text-[11px] text-slate-400">Standard A4 Size (210mm × 297mm)</span>
            </div>

            <div class="flex items-center gap-2">
                <!-- Zoom Toggle Button for Mobile Readability -->
                <button id="zoom-toggle-btn" onclick="togglePreviewZoom()" class="py-2 px-3.5 rounded-full bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700 text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition-colors">
                    <i id="zoom-icon" class="fas fa-search-plus"></i>
                    <span id="zoom-btn-text">100%</span>
                </button>

                <button id="download-pdf-btn" onclick="saveReportAsPDF()" class="py-2 px-4 sm:px-6 rounded-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold text-xs sm:text-sm shadow-lg active:scale-95 transition-all flex items-center gap-2">
                    <i class="fas fa-file-pdf"></i>
                    <span id="pdf-btn-text">Save PDF</span>
                </button>
            </div>
        </header>

        <!-- Scrollable Preview Viewport (Full width on mobile with 8px side padding) -->
        <div id="preview-scroll-area" class="flex-1 overflow-auto p-2 sm:p-6 flex flex-col items-center">
            <div id="a4-scale-box" class="a4-scale-wrapper">
                <!-- Actual Unshrinkable 794px A4 Sheet rendered here & captured by html2pdf -->
                <div id="a4-report-sheet" class="a4-sheet">
                    <!-- Populated dynamically by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Box (No alert() used) -->
    <div id="toast-box" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 translate-y-4 transition-all duration-300 bg-slate-900 text-white px-5 py-3 rounded-full shadow-xl text-xs sm:text-sm font-semibold flex items-center gap-2.5 border border-slate-700">
        <i id="toast-icon" class="fas fa-check-circle text-emerald-400"></i>
        <span id="toast-message">Notification</span>
    </div>

    <script>
        /**************************************************************
         * 1. STATE & FALLBACK DEMO DATA
         **************************************************************/
        const CURRENCY_SYMBOL = '৳';
        const ITEM_HEIGHT = 60; // Matches CSS --wheel-item-height: 60px

        const MONTHS = [
            { num: '01', name: 'January', bn: 'জানুয়ারি' },
            { num: '02', name: 'February', bn: 'ফেব্রুয়ারি' },
            { num: '03', name: 'March', bn: 'মার্চ' },
            { num: '04', name: 'April', bn: 'এপ্রিল' },
            { num: '05', name: 'May', bn: 'মে' },
            { num: '06', name: 'June', bn: 'জুন' },
            { num: '07', name: 'July', bn: 'জুলাই' },
            { num: '08', name: 'August', bn: 'আগস্ট' },
            { num: '09', name: 'September', bn: 'সেপ্টেম্বর' },
            { num: '10', name: 'October', bn: 'অক্টোবর' },
            { num: '11', name: 'November', bn: 'নভেম্বর' },
            { num: '12', name: 'December', bn: 'ডিসেম্বর' }
        ];

        // Default watermark SVG (subtle gear/engineering emblem) used only in Demo Mode if data.json has no logo
        const DEMO_WATERMARK_SVG = "data:image/svg+xml;utf8," + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
                <circle cx="100" cy="100" r="76" stroke="#1e293b" stroke-width="10" stroke-dasharray="18 10"/>
                <circle cx="100" cy="100" r="52" stroke="#1e293b" stroke-width="6"/>
                <path d="M100 58L114 90H86L100 58Z" fill="#1e293b"/>
                <rect x="92" y="96" width="16" height="44" rx="4" fill="#1e293b"/>
            </svg>
        `);

        // Realistic fallback data if data.json is not yet present on the server
        const todayISO = new Date().toISOString().slice(0, 10);
        const currentYM = todayISO.slice(0, 7);

        let sales = [];
        let expenses = [];

            logo: '',

            incomeCategories: ['Product Sale', 'Service']

        let currentReportMode = 'daily'; // 'daily' | 'monthly'

        let selectedMonth = String(new Date().getMonth() + 1).padStart(2, '0');
        let selectedDay = String(new Date().getDate()).padStart(2, '0');

        /**************************************************************
         * 2. LIVE CLOCK & CURRENT DATE
         **************************************************************/
        function updateLiveClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';

            hours = hours % 12;
            hours = hours ? hours : 12;
            const hoursStr = String(hours).padStart(2, '0');

            document.getElementById('clock-hm').textContent = `${hoursStr}:${minutes}`;
            document.getElementById('clock-sec').textContent = `:${seconds}`;
            document.getElementById('clock-ampm').textContent = ampm;

            const dateStr = now.toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            document.getElementById('current-date-display').textContent = dateStr;
        }

        /**************************************************************
         * 3. DATA LOADING (GitHub Pages data.json + Manual JSON)
         **************************************************************/
        function showToast(msg, isError = false) {
            const box = document.getElementById('toast-box');
            const icon = document.getElementById('toast-icon');
            const text = document.getElementById('toast-message');

            text.textContent = msg;
            icon.className = isError
                ? 'fas fa-exclamation-circle text-rose-400'
                : 'fas fa-check-circle text-emerald-400';

            box.classList.remove('opacity-0', 'translate-y-4');
            box.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => {
                box.classList.add('opacity-0', 'translate-y-4');
                box.classList.remove('opacity-100', 'translate-y-0');
            }, 3200);
        }

        function applyBackupData(data, sourceLabel, statusColor = 'emerald') {
            sales = Array.isArray(data.sales) ? data.sales : [];
            expenses = Array.isArray(data.expenses) ? data.expenses : [];
            if (data.settings && typeof data.settings === 'object') {
                settings = {
                    logo: data.settings.logo || '',
                    monthBasedCategories: data.settings.monthBasedCategories || ['House Rent', 'Salary', 'Electricity Bill'],
                    incomeCategories: data.settings.incomeCategories || ['Product Sale', 'Service']
                };
            }

            // Update Home Logo if settings.logo exists
            const logoWrapper = document.getElementById('home-logo-wrapper');
            const logoImg = document.getElementById('home-logo-img');
            if (settings.logo) {
                logoImg.src = settings.logo;
                logoWrapper.classList.remove('hidden');
            } else {
                logoWrapper.classList.add('hidden');
            }

            // Update Status Pill
            const pill = document.getElementById('data-status-pill');
            const dot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');

            statusText.textContent = sourceLabel;
            if (statusColor === 'emerald') {
                pill.className = 'inline-flex items-center gap-2 px-3.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 mb-6 shadow-sm';
                dot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
            } else if (statusColor === 'amber') {
                pill.className = 'inline-flex items-center gap-2 px-3.5 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200 mb-6 shadow-sm';
                dot.className = 'w-2 h-2 rounded-full bg-amber-500';
            } else {
                pill.className = 'inline-flex items-center gap-2 px-3.5 py-1 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200 mb-6 shadow-sm';
                dot.className = 'w-2 h-2 rounded-full bg-indigo-500';
            }

            document.getElementById('record-stats-text').textContent =
                `${sales.length} Sales • ${expenses.length} Expenses loaded`;

            // If there are dates in the dataset, default the wheel selector to the latest transaction date
            const allDates = [
                ...sales.map(s => s.date),
                ...expenses.map(e => e.date)
            ].filter(Boolean).sort();

            if (allDates.length > 0) {
                const latest = allDates[allDates.length - 1];
                const parts = latest.split('-');
                if (parts.length === 3) {
                    selectedYear = parseInt(parts[0], 10);
                    selectedMonth = parts[1];
                    selectedDay = parts[2];
                }
            }
        }

        async function fetchRemoteDataJson(showNotification = false) {
            const syncIcon = document.getElementById('sync-icon');
            if (syncIcon) syncIcon.classList.add('fa-spin');

            try {
                const response = await fetch(`./data.json?t=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const jsonData = await response.json();
                applyBackupData(jsonData, 'Synced with data.json', 'emerald');
                if (showNotification) {
                    showToast('data.json থেকে সর্বশেষ তথ্য আপডেট হয়েছে!');
                }
            } catch (err) {
                // If data.json is not found (e.g., before uploading to GitHub Pages), load demo data gracefully
                if (sales.length === 0 && expenses.length === 0) {
                    loadDemoFallbackData();
                }
                if (showNotification) {
                    showToast('data.json পাওয়া যায়নি। ম্যানুয়ালি JSON লোড করুন।', true);
                }
            } finally {
                if (syncIcon) setTimeout(() => syncIcon.classList.remove('fa-spin'), 400);
            }
        }

        /**************************************************************
         * 4. iPHONE-STYLE 3-ROW WHEEL PICKER LOGIC
         **************************************************************/
        function buildYearsList() {
            const currentY = new Date().getFullYear();
            const minYear = 2020;
            const maxYear = Math.max(currentY + 5, 2032);
            yearsList = [];
            for (let y = minYear; y <= maxYear; y++) {
                yearsList.push(y);
            }
        }

        function getDaysInMonth(year, monthStr) {
            const m = parseInt(monthStr, 10);
            return new Date(year, m, 0).getDate();
        }

        function renderWheelItems(wheelEl, items, selectedValue, onSelectCallback) {
            wheelEl.innerHTML = items.map((item, idx) => {
                const isSelected = String(item.value) === String(selectedValue);
                return `<div class="wheel-item ${isSelected ? 'active' : ''}" data-index="${idx}" data-value="${item.value}">${item.label}</div>`;
            }).join('');

            // Attach click handler so clicking the top or bottom faded item smoothly scrolls it to center
            const itemNodes = wheelEl.querySelectorAll('.wheel-item');
            itemNodes.forEach((node, idx) => {
                node.addEventListener('click', () => {
                    wheelEl.scrollTo({
                        top: idx * ITEM_HEIGHT,
                        behavior: 'smooth'
                    });
                });
            });

            // Position scroll immediately on the active index
            const activeIndex = Math.max(0, items.findIndex(i => String(i.value) === String(selectedValue)));
            requestAnimationFrame(() => {
                wheelEl.scrollTop = activeIndex * ITEM_HEIGHT;
                updateWheelActiveClasses(wheelEl, activeIndex);
            });

            // Attach scroll listener
            wheelEl.onscroll = () => {
                const rawIndex = Math.round(wheelEl.scrollTop / ITEM_HEIGHT);
                const clampedIndex = Math.max(0, Math.min(items.length - 1, rawIndex));
                updateWheelActiveClasses(wheelEl, clampedIndex);

                clearTimeout(wheelScrollTimeouts[wheelEl.id]);
                wheelScrollTimeouts[wheelEl.id] = setTimeout(() => {
                    const chosenItem = items[clampedIndex];
                    if (chosenItem) {
                        onSelectCallback(chosenItem.value);
                    }
                }, 90);
            };
        }

        function updateWheelActiveClasses(wheelEl, activeIdx) {
            const nodes = wheelEl.querySelectorAll('.wheel-item');
            nodes.forEach((node, idx) => {
                if (idx === activeIdx) {
                    node.classList.add('active');
                } else {
                    node.classList.remove('active');
                }
            });
        }

        function initAllWheels() {
            buildYearsList();

            // 1. Year Wheel
            const yearWheel = document.getElementById('wheel-year');
            const yearItems = yearsList.map(y => ({ value: y, label: String(y) }));
            renderWheelItems(yearWheel, yearItems, selectedYear, (val) => {
                selectedYear = parseInt(val, 10);
                syncDayWheelForMonthYear();
                updateSelectedBadge();
            });

            // 2. Month Wheel
            const monthWheel = document.getElementById('wheel-month');
            const monthItems = MONTHS.map(m => ({ value: m.num, label: m.name.slice(0, 3) + ' (' + m.num + ')' }));
            renderWheelItems(monthWheel, monthItems, selectedMonth, (val) => {
                selectedMonth = String(val);
                syncDayWheelForMonthYear();
                updateSelectedBadge();
            });

            // 3. Day Wheel
            syncDayWheelForMonthYear();
            updateSelectedBadge();
        }

        function syncDayWheelForMonthYear() {
            const maxDays = getDaysInMonth(selectedYear, selectedMonth);
            if (parseInt(selectedDay, 10) > maxDays) {
                selectedDay = String(maxDays).padStart(2, '0');
            }

            const dayWheel = document.getElementById('wheel-day');
            const dayItems = [];
            for (let d = 1; d <= maxDays; d++) {
                const dStr = String(d).padStart(2, '0');
                dayItems.push({ value: dStr, label: dStr });
            }

            renderWheelItems(dayWheel, dayItems, selectedDay, (val) => {
                selectedDay = String(val);
                updateSelectedBadge();
            });
        }

        function updateSelectedBadge() {
            const monthObj = MONTHS.find(m => m.num === selectedMonth) || MONTHS[0];
            const badge = document.getElementById('selected-date-badge');
            if (currentReportMode === 'daily') {
                badge.textContent = `${selectedYear} • ${monthObj.name} • ${selectedDay}`;
            } else {
                badge.textContent = `${selectedYear} • ${monthObj.name}`;
            }
        }

            const dayHeaderLabel = document.getElementById('day-header-label');

        /**************************************************************
         * 5. A4 REPORT GENERATION & PREVIEW (DAILY & MONTHLY)
         **************************************************************/
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function adjustA4PreviewScale() {
            const sheet = document.getElementById('a4-report-sheet');
            const scaleBox = document.getElementById('a4-scale-box');
            const scrollArea = document.getElementById('preview-scroll-area');
            if (!sheet || !scaleBox) return;

            const a4Width = 794;
            // Use nearly the entire mobile width (only 16px total horizontal margin)
            const availableWidth = Math.max(280, window.innerWidth - 16);

            // Measure natural unscaled height of the 794px A4 sheet
            const naturalHeight = Math.max(1123, sheet.scrollHeight);

            if (!isZoomed100 && availableWidth < a4Width) {
                const scale = availableWidth / a4Width;
                sheet.style.transform = `scale(${scale})`;
                sheet.style.transformOrigin = 'top left';
                scaleBox.style.width = `${Math.floor(a4Width * scale)}px`;
                scaleBox.style.height = `${Math.ceil(naturalHeight * scale)}px`;
                if (scrollArea) scrollArea.classList.add('items-center');
                if (scrollArea) scrollArea.classList.remove('items-start');
            } else {
                sheet.style.transform = 'scale(1)';
                sheet.style.transformOrigin = 'top left';
                scaleBox.style.width = `${a4Width}px`;
                scaleBox.style.height = `${naturalHeight}px`;
                if (scrollArea) {
                    if (window.innerWidth < a4Width) {
                        scrollArea.classList.remove('items-center');
                        scrollArea.classList.add('items-start');
                    } else {
                        scrollArea.classList.add('items-center');
                        scrollArea.classList.remove('items-start');
                    }
                }
            }
        }

        function togglePreviewZoom() {
            isZoomed100 = !isZoomed100;
            const zoomIcon = document.getElementById('zoom-icon');
            const zoomText = document.getElementById('zoom-btn-text');
            if (isZoomed100) {
                zoomIcon.className = 'fas fa-compress-arrows-alt';
                zoomText.textContent = 'Fit Screen';
            } else {
                zoomIcon.className = 'fas fa-search-plus';
                zoomText.textContent = '100%';
            }
            adjustA4PreviewScale();
        }

        function openReportPreview() {
            const sheet = document.getElementById('a4-report-sheet');
            sheet.innerHTML = buildReportHTML();

            // Reset zoom to Fit Screen by default when opening preview
            isZoomed100 = false;
            const zoomIcon = document.getElementById('zoom-icon');
            const zoomText = document.getElementById('zoom-btn-text');
            if (zoomIcon && zoomText) {
                zoomIcon.className = 'fas fa-search-plus';
                zoomText.textContent = '100%';
            }

            const toolbarTitle = document.getElementById('preview-toolbar-title');
            if (currentReportMode === 'daily') {
                toolbarTitle.textContent = `Daily Report (${selectedYear}-${selectedMonth}-${selectedDay})`;
            } else {
                toolbarTitle.textContent = `Monthly Report (${selectedYear}-${selectedMonth})`;
            }

            closePickerModal();
            const previewModal = document.getElementById('preview-modal');
            previewModal.classList.add('open');

            requestAnimationFrame(() => {
                adjustA4PreviewScale();
            });
        }

        function closeReportPreview() {
            document.getElementById('preview-modal').classList.remove('open');
        }

        /**************************************************************
         * 6. DIRECT A4 PDF DOWNLOAD (html2pdf.js)
         **************************************************************/
        async function saveReportAsPDF() {
            const sheet = document.getElementById('a4-report-sheet');
            const scaleBox = document.getElementById('a4-scale-box');
            const btn = document.getElementById('download-pdf-btn');
            const btnText = document.getElementById('pdf-btn-text');

            const fileSuffix = currentReportMode === 'daily'
                ? `Daily_${selectedYear}-${selectedMonth}-${selectedDay}`
                : `Monthly_${selectedYear}-${selectedMonth}`;
            const fileName = `Inspire_Engineering_${fileSuffix}.pdf`;

            // Temporarily restore 1:1 794px A4 dimensions so html2pdf captures crisp full-width A4
            sheet.style.transform = 'none';
            scaleBox.style.width = '794px';
            scaleBox.style.height = 'auto';
            scaleBox.style.boxShadow = 'none';

            btn.disabled = true;
            btnText.textContent = 'Saving...';

            const opt = {
                margin: 0,
                filename: fileName,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: {
                    scale: 2,
                    width: 794,
                    windowWidth: 794,
                    useCORS: true,
                    letterRendering: true,
                    scrollX: 0,
                    scrollY: 0
                },
                jsPDF: {
                    unit: 'mm',
                    format: 'a4',
                    orientation: 'portrait'
                }
            };

            try {
                await html2pdf().set(opt).from(sheet).save();
                showToast('A4 PDF সফলভাবে ডাউনলোড হয়েছে!');
            } catch (err) {
                console.error(err);
                showToast('PDF সেভ করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।', true);
            } finally {
                scaleBox.style.boxShadow = '';
                btn.disabled = false;
                btnText.textContent = 'Save PDF';
                adjustA4PreviewScale();
            }
        }

        /**************************************************************
         * 7. INITIALIZATION & EVENT LISTENERS
         **************************************************************/
        document.addEventListener('DOMContentLoaded', () => {
            // Start Live Digital Clock
            updateLiveClock();
            setInterval(updateLiveClock, 1000);

            // Auto-fetch data.json from GitHub Pages directory
            fetchRemoteDataJson(false);

            // Open Report Picker Modal
            document.getElementById('open-report-modal-btn').addEventListener('click', openPickerModal);

            // Sync Button for data.json
            document.getElementById('reload-remote-json-btn').addEventListener('click', () => {
                fetchRemoteDataJson(true);
            });

            // Manual JSON File Upload Handler
            document.getElementById('manual-json-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const parsed = JSON.parse(ev.target.result);
                        applyBackupData(parsed, `Loaded: ${file.name}`, 'emerald');
                        showToast('ব্যাকআপ JSON ফাইল সফলভাবে লোড হয়েছে!');
                    } catch (err) {
                        showToast('সঠিক JSON ব্যাকআপ ফাইল নির্বাচন করুন!', true);
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            });

            // Responsive A4 preview resize listener
            window.addEventListener('resize', adjustA4PreviewScale);
        });
    </script>
</body>
  </html>
